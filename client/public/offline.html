<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KisanSetu — Offline</title>
    <style>
      body { font-family: Manrope, system-ui, sans-serif; background: #FAF7F0; color: #1C1C19; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 24px; text-align: center; }
      .card { max-width: 380px; }
      h1 { font-size: 20px; margin-bottom: 8px; color: #1F4D36; }
      p { font-size: 14px; line-height: 1.5; color: #4A4A45; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>KisanSetu needs a connection for live prices, orders, and payments. Your recently viewed pages are still available — reconnect to pick up where you left off.</p>
      <button onclick="window.location.href='/'" style="margin-top: 16px; padding: 10px 20px; background: #1F4D36; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;">
        Retry Connection
      </button>
    </div>
    <script>
      // Auto-reconnect if browser is actually online
      if (navigator.onLine) {
        window.location.href = '/';
      }
      window.addEventListener('online', () => {
        window.location.href = '/';
      });
    </script>
  </body>
</html>
